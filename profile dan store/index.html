<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Profile</title>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                padding: 25px;
                font-family: "Courier New", monospace;
                color: #fff;
                background:
                    radial-gradient(circle at 50% 10%, #173c75 0%, #081329 38%, #030711 100%);
                min-height: 100vh;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                opacity: .35;
                background-image:
                    radial-gradient(#fff 1px, transparent 1px),
                    radial-gradient(#fff 1px, transparent 1px);
                background-size: 70px 70px, 110px 110px;
                background-position: 10px 20px, 50px 80px;
            }

            .container {
                max-width: 900px;
                margin: auto;
                position: relative;
                z-index: 1;
            }

            .hero-title {
                text-align: center;
                margin-bottom: 25px;
            }

            .hero-title h1 {
                margin: 0;
                font-size: 42px;
                color: #ef1717;
                letter-spacing: 2px;
                text-shadow:
                    4px 4px 0 #050505,
                    7px 7px 0 #154b9a;
            }

            .hero-title p {
                margin: 12px 0 0;
                color: #ffd72f;
                font-weight: bold;
                letter-spacing: 3px;
                font-size: 13px;
            }

            .panel {
                background: linear-gradient(145deg, #0c2b52, #061529);
                border: 3px solid #1d8ddd;
                box-shadow:
                    0 0 0 3px #06203c,
                    0 0 25px rgba(24, 145, 230, .35);
                padding: 20px;
                margin-bottom: 22px;
            }

            .panel-title {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 18px;
                padding-bottom: 10px;
                border-bottom: 2px dashed #207ac0;
            }

            .panel-title h2 {
                margin: 0;
                font-size: 18px;
            }

            .panel-title span {
                color: #ef2020;
                font-size: 12px;
                font-weight: bold;
            }

            .profile-card {
                display: flex;
                align-items: center;
                gap: 22px;
                padding: 18px;
                background: #07182e;
                border: 2px solid #1a6eb0;
                box-shadow: inset 0 0 15px rgba(0,0,0,.5);
            }

            .profile-image {
                width: 105px;
                height: 105px;
                min-width: 105px;
                display: flex;
                align-items: center;
                justify-content: center;
                background:
                    radial-gradient(circle at 50% 40%, #ef2525 0 28%, #9e0d0d 29% 45%, #050505 46% 100%);
                border: 4px solid #050505;
                box-shadow:
                    0 0 0 3px #e51d25,
                    0 0 15px rgba(239,29,37,.5);
                font-size: 45px;
            }

            .profile-info h2 {
                margin: 0 0 8px;
                color: #fff;
                font-size: 25px;
                text-shadow: 2px 2px #000;
            }

            .profile-info p {
                margin: 0 0 12px;
                color: #a8c9ec;
                font-size: 13px;
            }

            .skills {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
            }

            .skill {
                padding: 6px 11px;
                color: #fff;
                background: #174e8e;
                border: 1px solid #2b8ed5;
                font-size: 11px;
                font-weight: bold;
                box-shadow: 2px 2px 0 #02050a;
            }

            .skill:nth-child(even) {
                background: #a70e18;
                border-color: #ed2b34;
            }

            .buttons {
                display: flex;
                gap: 10px;
                flex-wrap: wrap;
                margin-top: 18px;
            }

            button {
                border: 2px solid #131212;
                background: #e51b23;
                color: #fff;
                padding: 9px 15px;
                font-family: "Courier New", monospace;
                font-size: 12px;
                font-weight: bold;
                cursor: pointer;
                box-shadow: 3px 3px 0 #050505;
            }

            button:hover {
                background: #ff3038;
                transform: translate(2px, 2px);
                box-shadow: 1px 1px 0 #050505;
            }

            button.blue {
                background: #0878c9;
            }

            button.blue:hover {
                background: #1599f2;
            }

            button.reset {
                background: #06172c;
                border-color: #208bd1;
                color: #75c9ff;
            }

            .form-box {
                background: #071324;
                border: 2px solid #1b73b5;
                padding: 20px;
            }

            .form-group {
                margin-bottom: 17px;
            }

            label {
                display: block;
                margin-bottom: 7px;
                color: #8ed2ff;
                font-size: 12px;
                font-weight: bold;
            }

            input,
            textarea {
                width: 100%;
                padding: 11px 12px;
                border: 2px solid #174f81;
                background: #020b18;
                color: #fff;
                font-family: "Courier New", monospace;
                font-size: 12px;
                outline: none;
            }

            input:focus,
            textarea:focus {
                border-color: #ed2028;
                box-shadow: 0 0 8px rgba(237,32,40,.35);
            }

            input::placeholder,
            textarea::placeholder {
                color: #61778f;
            }

            textarea {
                height: 100px;
                resize: none;
            }

            .error {
                display: none;
                margin-top: 6px;
                color: #ff4d55;
                font-size: 11px;
            }

            .success {
                display: none;
                margin-top: 12px;
                padding: 10px;
                background: #063d37;
                border: 1px solid #19b89b;
                color: #5effdf;
                font-size: 12px;
            }

            .web-decoration {
                text-align: center;
                color: #368fd0;
                font-size: 25px;
                letter-spacing: 8px;
                margin: 8px 0 20px;
            }

            .store-button {
                text-align: center;
                margin-top: 25px;
            }

            @media (max-width: 600px) {

                body {
                    padding: 15px;
                }

                .hero-title h1 {
                    font-size: 30px;
                }

                .profile-card {
                    flex-direction: column;
                    text-align: center;
                }

                .profile-image {
                    width: 90px;
                    height: 90px;
                    min-width: 90px;
                }

                .skills {
                    justify-content: center;
                }

                .buttons {
                    justify-content: center;
                }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="hero-title">
                <h1>WELCOME</h1>
                <p>PROFILE SYSTEM</p>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <h2>🕷 PROFILE SYSTEM</h2>
                    <span>ONLINE</span>
                </div>

                <div class="profile-card" id="profileCard">
                    <div class="profile-image">
                        🕷
                    </div>

                    <div class="profile-info">
                        <h2 id="profileName">
                            Neisya Fadilla
                        </h2>

                        <p>
                            ◈ Web Developer &amp; jQuery Enthusiast
                        </p>

                        <div class="skills" id="skillList">
                            <span class="skill">HTML5</span>
                            <span class="skill">CSS3</span>
                            <span class="skill">JavaScript</span>
                            <span class="skill">jQuery</span>
                        </div>
                    </div>
                </div>

                <div class="buttons">
                    <button id="btnGantiNama">
                        ✎ GANTI NAMA
                    </button>

                    <button class="blue" id="btnTambahSkill">
                        + TAMBAH SKILL
                    </button>

                    <button id="btnAnimasi">
                        ◈ FADE &amp; SLIDE
                    </button>

                    <button class="reset" id="btnReset">
                        ↶ RESET
                    </button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <h2>✉ MESSAGE CENTER</h2>
                    <span>SECURE</span>
                </div>

                <div class="form-box">
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="nama">
                                NAMA LENGKAP
                            </label>

                            <input
                                type="text"
                                id="nama"
                                placeholder="Masukkan nama minimal 3 karakter"
                            >

                            <div class="error" id="errNama">
                                Nama minimal 3 karakter.
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="email">
                                EMAIL
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="contoh@gmail.com"
                            >

                            <div class="error" id="errEmail">
                                Masukkan email yang valid.
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="pesan">
                                PESAN
                            </label>

                            <textarea
                                id="pesan"
                                placeholder="Tulis pesan minimal 10 karakter"
                            ></textarea>

                            <div class="error" id="errPesan">
                                Pesan minimal 10 karakter.
                            </div>
                        </div>

                        <div class="buttons">
                            <button type="submit">
                                ➤ KIRIM PESAN
                            </button>

                            <button
                                type="button"
                                class="reset"
                                id="btnResetForm"
                            >
                                ↶ RESET
                            </button>
                        </div>

                        <div class="success" id="successMessage">
                            ✓ Pesan berhasil dikirim!
                        </div>
                    </form>
                </div>
            </div>

            <div class="store-button">
                <button
                    class="blue"
                    onclick="window.location.href='keranjang.html'"
                >
                    BUKA SPIDER WEB STORE
                </button>
            </div>
        </div>

        <script>
            $(document).ready(function() {
                $('#btnGantiNama').click(function() {
                    $('#profileName')
                        .text('Rina Wijaya')
                        .css('color', '#ef2525');
                });

                $('#btnTambahSkill').click(function() {
                    if ($('#skillList .skill').length < 5) {
                        $('#skillList').append(
                            '<span class="skill">Bootstrap</span>'
                        );
                    }
                });

                $('#btnAnimasi').click(function() {
                    $('#profileCard')
                        .fadeOut(300)
                        .fadeIn(600)
                        .slideUp(200)
                        .slideDown(300);
                });

                $('#btnReset').click(function() {
                    $('#profileName')
                        .text('Budi Santoso')
                        .css('color', '#fff');
                    $('#skillList').html(
                        '<span class="skill">HTML5</span>' +
                        '<span class="skill">CSS3</span>' +
                        '<span class="skill">JavaScript</span>' +
                        '<span class="skill">jQuery</span>'
                    );
                });

                $('#nama').on('input', function() {
                    if ($(this).val().trim().length >= 3) {
                        $('#errNama').hide();
                    }
                });

                $('#email').on('input', function() {
                    let email = $(this).val().trim();
                    if (
                        email.includes('@') &&
                        email.includes('.')
                    ) {
                        $('#errEmail').hide();
                    }
                });

                $('#pesan').on('input', function() {
                    if ($(this).val().trim().length >= 10) {
                        $('#errPesan').hide();
                    }
                });

                $('#contactForm').submit(function(e) {
                    e.preventDefault();
                    let valid = true;

                    if ($('#nama').val().trim().length < 3) {
                        $('#errNama').show();
                        valid = false;
                    } else {
                        $('#errNama').hide();
                    }

                    let email = $('#email').val().trim();
                    if (
                        email === '' ||
                        !email.includes('@') ||
                        !email.includes('.')
                    ) {
                        $('#errEmail').show();
                        valid = false;
                    } else {
                        $('#errEmail').hide();
                    }

                    if ($('#pesan').val().trim().length < 10) {
                        $('#errPesan').show();
                        valid = false;
                    } else {
                        $('#errPesan').hide();
                    }

                    if (valid) {
                        $('#successMessage')
                            .fadeIn()
                            .delay(2000)
                            .fadeOut();
                    }
                });

                $('#btnResetForm').click(function() {
                    $('#contactForm')[0].reset();
                    $('.error').hide();
                    $('#successMessage').hide();
                });
            });
        </script>
    </body>
</html>
